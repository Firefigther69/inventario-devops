# Pipeline de Entrega Continua
# Disparador: creación de un tag de versión semántica (v1.0.0, v1.1.0, ...) sobre un commit de main.
# Flujo:  promoción de imagen (sha-xxxxxxx -> vX.Y.Z / latest)  ->  aprobación del ambiente
#         "production"  ->  despliegue en la VM de Azure  ->  verificación  ->  rollback si falla
#         ->  GitHub Release.
# Credenciales: solo secretos de GitHub (VM_HOST, VM_USER, VM_SSH_KEY) y GITHUB_TOKEN.
name: CD

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag existente a redesplegar (ej. v1.0.0) — permite volver a una versión anterior"
        required: true

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ---------- Etapa 1: promoción del artefacto ya validado por CI ----------
  promote:
    name: Promover imagen a versión
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0

      - name: Calcular versión y commit
        id: meta
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Verificar que el tag está en main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::El tag no pertenece a main"; exit 1; }

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Re-etiquetar la imagen validada (sin reconstruir)
        run: |
          SRC="${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}"
          if ! docker buildx imagetools inspect "$SRC" > /dev/null 2>&1; then
            echo "::error::No existe $SRC. El commit debe pasar el pipeline CI en main antes de liberarse."
            exit 1
          fi
          docker buildx imagetools create -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" -t "${{ steps.meta.outputs.image }}:latest" "$SRC"
          echo "Promovida $SRC -> ${{ steps.meta.outputs.version }}, latest" >> "$GITHUB_STEP_SUMMARY"

  # ---------- Etapa 2: despliegue al ambiente Cloud (requiere aprobación) ----------
  deploy:
    name: Desplegar en Azure (production)
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Copiar definición de servicios a la VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/inventario

      - name: Desplegar nueva versión
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.promote.outputs.image }}
          VERSION: ${{ needs.promote.outputs.version }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: IMAGE,VERSION,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            cd /opt/inventario
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Guardar la versión actual para un posible rollback
            grep '^IMAGE=' .env | cut -d= -f2- > .previous_image || true
            sed -i "s#^IMAGE=.*#IMAGE=${IMAGE}:${VERSION}#" .env
            sed -i "s#^APP_VERSION=.*#APP_VERSION=${VERSION}#" .env
            docker compose pull app
            docker compose up -d --no-build --remove-orphans
            docker image prune -f
            docker logout ghcr.io
            docker compose ps

      - name: Verificar despliegue (health check + versión)
        id: verify
        run: |
          for i in $(seq 1 30); do
            BODY="$(curl -fsS "${{ vars.APP_URL }}/health" || true)"
            echo "$BODY"
            if echo "$BODY" | grep -q "\"version\":\"${{ needs.promote.outputs.version }}\""; then
              echo "Versión ${{ needs.promote.outputs.version }} en línea" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::La aplicación no respondió con la versión esperada"
          exit 1

      - name: Rollback automático
        if: failure() && steps.verify.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/inventario
            PREV="$(cat .previous_image)"
            sed -i "s#^IMAGE=.*#IMAGE=${PREV}#" .env
            sed -i "s#^APP_VERSION=.*#APP_VERSION=${PREV##*:}#" .env
            docker compose up -d --no-build
            echo "Rollback a ${PREV}"

  # ---------- Etapa 3: publicación de la versión ----------
  release:
    name: Publicar GitHub Release
    needs: [promote, deploy]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Crear Release con notas automáticas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.promote.outputs.version }}" \
            --title "Inventario ${{ needs.promote.outputs.version }}" \
            --generate-notes \
            --notes "Imagen: \`${{ needs.promote.outputs.image }}:${{ needs.promote.outputs.version }}\`"
