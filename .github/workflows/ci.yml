# Pipeline de Integración Continua
# Disparadores: pull request hacia main, push a main (merge) y ejecución manual.
# Condición de falla: cualquier etapa que falle detiene las etapas dependientes y bloquea el merge
# (los checks son obligatorios en la regla de protección de main).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io

jobs:
  # ---------- Etapa 1: validaciones automáticas ----------
  lint:
    name: Lint y auditoría de dependencias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint (análisis estático)
        run: npm run lint

      - name: Auditoría de dependencias (falla con vulnerabilidades altas o críticas)
        run: npm run audit

  # ---------- Etapa 2: pruebas ----------
  test:
    name: Pruebas unitarias e integración
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

      - name: Ejecutar pruebas con cobertura
        run: npm test

      - name: Publicar reportes (JUnit + cobertura)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            app/reports/junit.xml
            app/coverage/
          retention-days: 30

      - name: Resumen de cobertura
        if: always()
        run: |
          echo "## Cobertura de pruebas" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx jest --coverage --coverageReporters=text-summary --silent 2>&1 | grep -E "Statements|Branches|Functions|Lines" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------- Etapa 3: validación de infraestructura como código ----------
  iac:
    name: Validar Terraform y configuración
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: terraform init + validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

      - name: Escaneo de seguridad IaC y Dockerfile (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"

  # ---------- Etapa 4: construcción y publicación de la imagen ----------
  docker:
    name: Construir y publicar imagen
    needs: [test, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Calcular nombre y etiquetas de la imagen
        id: meta
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
          build-args: APP_VERSION=sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prueba de humo del contenedor
        run: |
          docker run -d --name smoke -p 3000:3000 ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Escaneo de vulnerabilidades de la imagen (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Publicar imagen en GHCR (solo en main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }} ${{ steps.meta.outputs.image }}:main
          docker push ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
          docker push ${{ steps.meta.outputs.image }}:main
          {
            echo "## Imagen publicada"
            echo "- \`${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}\`"
            echo "- \`${{ steps.meta.outputs.image }}:main\`"
          } >> "$GITHUB_STEP_SUMMARY"
