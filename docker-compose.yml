# Orquestación de servicios: aplicación + base de datos PostgreSQL.
# Desarrollo local:   docker compose up -d --build
# Producción (VM):    IMAGE=ghcr.io/<owner>/<repo>:v1.0.0 docker compose up -d
# Las credenciales se leen desde el archivo .env (no versionado). Ver .env.example.
name: inventario

services:
  app:
    image: ${IMAGE:-inventario-api:local}
    build:
      context: .
      args:
        APP_VERSION: local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_VERSION: ${APP_VERSION:-local}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-inventario}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Definir POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-inventario}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    # Sin "ports": la BD solo es accesible desde la red interna "backend".

volumes:
  pgdata:

networks:
  backend:
